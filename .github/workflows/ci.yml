name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    # The full suite takes ~10 minutes under TCG (no KVM) on a dev
    # machine, and this budget also has to cover apt-get, the build and
    # the static checks.  Keep real headroom: a timeout here is a flaky
    # red build, not a real failure.
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build & test dependencies
        run: |
          sudo apt-get update
          # -m32 cross build (the Linux branch of the Makefile uses the
          # native gcc -m32 toolchain) + QEMU.  QEMU runs without KVM
          # here (TCG software emulation); the harness is fully headless.
          sudo apt-get install -y gcc-multilib binutils qemu-system-x86

      - name: Check the memory map (no compiler needed)
        # Catches overlapping regions, hard-coded user addresses and a
        # cache that no longer fits *before* spending time on a build.
        run: python3 scripts/check-layout.py

      - name: Check the docs against the memory map
        # The docs are this repository's product: a tutorial chapter that
        # still teaches the pre-M3 layout is a bug.  Also self-tests the
        # checker itself (it must fail on the eight known-bad probes).
        run: |
          python3 scripts/check-docs.py
          bash scripts/check-docs-selftest.sh

      - name: Build the kernel
        run: |
          make clean
          make Image
          make minix.img

      - name: Re-check the memory map against the linked kernel (_end)
        run: make check-layout

      - name: Run regression suite (make test)
        # Without KVM the virtual CPU runs under TCG, so give the
        # key-injection / serial-capture windows more slack than locally.
        # Pull requests run the fast subset: the three heavy cases
        # (autosync / oom / evict) need multi-second waits and real memory
        # pressure, and together they are most of the suite's runtime.
        # Pushes to main run everything.
        env:
          TEST_HOLD: "2"
          TEST_TAIL: "4"
          TEST_SKIP_HEAVY: ${{ github.event_name == 'pull_request' && '1' || '0' }}
        run: make test

      - name: Upload serial logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: regression-logs
          path: test-logs/
